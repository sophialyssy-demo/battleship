<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Battleship vs AI</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Battleship</h1>
    <p class="tagline">Fleet command console</p>
    <p id="status" role="status" aria-live="polite"></p>
  </header>

  <section id="controls">
    <div id="placement-controls">
      <button id="rotate" type="button">Rotate (R)</button>
      <button id="random" type="button">Random placement</button>
      <button id="clear" type="button">Clear</button>
      <label>
        AI difficulty
        <select id="difficulty">
          <option value="hard" selected>Hard</option>
          <option value="easy">Easy</option>
        </select>
      </label>
      <button id="start" type="button" class="primary" disabled>Start game</button>
    </div>
    <button id="restart" type="button" class="primary" hidden>Play again</button>
  </section>

  <main>
    <div id="player-panel" class="board-wrap panel">
      <h2><span class="lamp"></span>Your fleet</h2>
      <div class="grid-frame">
        <div id="player-board" class="board" aria-label="Your board"></div>
      </div>
      <ul id="player-fleet" class="fleet"></ul>
    </div>
    <div id="enemy-panel" class="board-wrap panel">
      <h2><span class="lamp"></span>Enemy waters</h2>
      <div class="grid-frame">
        <div id="enemy-board" class="board" aria-label="Enemy board"></div>
        <div class="sweep" aria-hidden="true"></div>
        <div id="banner" hidden></div>
      </div>
      <ul id="enemy-fleet" class="fleet"></ul>
    </div>
  </main>

  <section class="log-wrap panel">
    <h2>Battle log</h2>
    <ol id="log" reversed></ol>
  </section>

  <script type="module" src="src/main.js"></script>
</body>
</html>
