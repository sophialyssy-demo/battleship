<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lone Star Showdown: Battleship vs AI</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1><span class="star" aria-hidden="true"></span>Lone Star Showdown<span class="star" aria-hidden="true"></span></h1>
    <p class="tagline">Battleship, Texas style</p>
    <p id="status" role="status" aria-live="polite"></p>
    <button id="mute" type="button" class="mute" aria-pressed="false">Sound: on (M)</button>
  </header>

  <section id="controls">
    <div id="placement-controls">
      <button id="rotate" type="button">Turn (R)</button>
      <button id="random" type="button">Random placement</button>
      <button id="clear" type="button">Clear ranch</button>
      <label>
        Opponent
        <select id="difficulty">
          <option value="hard" selected>The Outlaw (hard)</option>
          <option value="easy">The Greenhorn (easy)</option>
        </select>
      </label>
      <button id="start" type="button" class="primary" disabled>Draw!</button>
    </div>
    <button id="restart" type="button" class="primary" hidden>Saddle up again</button>
  </section>

  <main>
    <div id="player-panel" class="board-wrap panel">
      <h2><span class="lamp"></span>Your ranch</h2>
      <div class="grid-frame">
        <div id="player-board" class="board" aria-label="Your ranch"></div>
      </div>
      <ul id="player-fleet" class="fleet"></ul>
    </div>
    <div id="enemy-panel" class="board-wrap panel">
      <h2><span class="lamp"></span>Rival ranch <span id="foe-badge" class="foe-badge"></span></h2>
      <div class="grid-frame">
        <div id="enemy-board" class="board" aria-label="Rival ranch"></div>
        <div class="tumbleweed" aria-hidden="true"></div>
        <div id="banner" hidden></div>
      </div>
      <ul id="enemy-fleet" class="fleet"></ul>
    </div>
  </main>

  <section class="log-wrap panel">
    <h2>Sheriff&rsquo;s ledger</h2>
    <ol id="log" reversed></ol>
  </section>

  <script type="module" src="src/main.js"></script>
</body>
</html>
